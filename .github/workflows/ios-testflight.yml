name: iOS TestFlight
# Archives the MODEL-FREE app (project-ci.yml) with manual signing and uploads it to
# TestFlight, for forks without a Mac. Team ID and bundle ID are read from the
# provisioning profile, so nothing account-specific lives in the repo.
#
# Secrets (create the signing ones once with tools/ios_signing_setup.py):
#   IOS_DIST_P12, IOS_DIST_P12_PASSWORD  Apple Distribution certificate + key (base64 .p12)
#   IOS_PROFILE                          App Store provisioning profile (base64)
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8  App Store Connect API key (base64 .p8), for upload
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight (untick to only test signing)
        type: boolean
        default: true
concurrency:
  group: ios-testflight
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-testflight-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: ios-testflight-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          xcodebuild -version
      - name: Build Rust iOS framework
        run: bash apps/ios/build-xcframework.sh
      - name: Generate model-free project
        working-directory: apps/ios/OuraApp
        run: xcodegen generate --spec project-ci.yml
      - name: Install signing certificate and profile
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<sha1>/'

          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw "$RUNNER_TEMP/profile.plist")
          APP_ID=$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#"$TEAM_ID".}"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          echo "::add-mask::$TEAM_ID"
          echo "::add-mask::$BUNDLE_ID"
          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=$BUNDLE_ID"
          } >> "$GITHUB_ENV"
      - name: Archive
        working-directory: apps/ios/OuraApp
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OuraApp.xcodeproj -scheme OuraApp -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/OuraApp.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "^(error|warning: unable|\*\* |.*: error:)|Signing Identity|Provisioning Profile" || true
          test -d "$RUNNER_TEMP/OuraApp.xcarchive" || { tail -n 80 "$RUNNER_TEMP/archive.log"; exit 1; }
      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OuraApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -lh "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
